// Apply release processing with optional dedicated CI signing, preserving the application ID.
gradle.beforeProject { application ->
    def skipFullStory = application.providers.gradleProperty('pgoSkipFullStory').getOrElse('false') == 'true'
    if (skipFullStory) {
        application.tasks.configureEach { task ->
            if (task.name.toLowerCase().startsWith('fullstory')) {
                task.enabled = false
            }
        }
    }
    application.plugins.withId('com.android.application') {
        application.extensions.getByName('androidComponents').finalizeDsl { android ->
            def release = android.buildTypes.findByName('release')
            if (release == null) {
                throw new GradleException('The PGO release pipeline requires a release build type.')
            }
            release.minifyEnabled = true
            release.proguardFiles android.getDefaultProguardFile('proguard-android-optimize.txt'), application.file('proguard-rules.pro')
            def keystorePath = System.getenv('PGO_ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                def storePassword = System.getenv('PGO_ANDROID_KEYSTORE_PASSWORD')
                def keyAlias = System.getenv('PGO_ANDROID_KEY_ALIAS')
                def keyPassword = System.getenv('PGO_ANDROID_KEY_PASSWORD')
                if (!storePassword || !keyAlias || !keyPassword) {
                    throw new GradleException('Dedicated PGO signing requires all Android keystore settings.')
                }
                def signing = android.signingConfigs.maybeCreate('pgoEvaluation')
                signing.storeFile = application.file(keystorePath)
                signing.storePassword = storePassword
                signing.keyAlias = keyAlias
                signing.keyPassword = keyPassword
                release.signingConfig = signing
            }
            application.logger.lifecycle("PGO shrinking enabled; FullStory tasks ${skipFullStory ? 'disabled' : 'enabled'}; application ID preserved.")
        }
    }
}
