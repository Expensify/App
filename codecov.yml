# https://docs.codecov.com/docs/codecovyml-reference
coverage:
  status:
    project:
      default:
        informational: true
        target: auto
        branches:
          - main
    patch:
      default:
        informational: true
        target: auto
        threshold: 1%

codecov:
  notify:
    wait_for_ci: true

comment:
  require_changes: 'uncovered_patch'
  layout: 'condensed_header, files'
  hide_project_coverage: true
  hide_comment_details: false

flags:
  unit:
    paths:
      - src/

ignore:
  - 'src/languages/**'
