# Files perf tests depend on without importing them, so Jest can't tell which tests they affect. A PR that
# changes any of them runs every perf test, on both main's side and the PR's. Used by both jobs in
# reassurePerformanceTests.yml. See .github/workflows/README.md#selective-test-runs.
any:
  - 'package.json'
  - 'package-lock.json'
  - 'patches/**'
  - 'modules/**'
  - 'jest.config.js'
  - 'jest/**'
  - '**/__mocks__/**'
  - 'tests/utils/**'
  - 'tests/perf-test/setupAfterEnv.ts'
  - 'babel.config.js'
  - 'config/babel/**'
  - 'tsconfig.json'
  - '.nvmrc'
  - '.github/workflows/test.yml'
  - '.github/workflows/reassurePerformanceTests.yml'
  - '.github/actions/composite/setupNode/**'
  - 'src/polyfills/**'
  - '.github/reassureFullRunPaths.yml'
