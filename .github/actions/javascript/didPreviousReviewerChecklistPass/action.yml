name: 'Did previous reviewer checklist pass'
description: 'Whether the latest completed reviewer checklist run for this pull request succeeded, including on an older commit.'
inputs:
  GITHUB_TOKEN:
    description: Auth token for repository API calls
    required: true
  PR_NUMBER:
    description: Pull request number
    required: true
  HEAD_REF:
    description: Pull request head branch. Used to list workflow runs; a run only counts if it belongs to this pull request.
    required: true
outputs:
  PASSED:
    description: "'true' if the latest completed run for this pull request succeeded"
runs:
  using: 'node24'
  main: './index.js'
