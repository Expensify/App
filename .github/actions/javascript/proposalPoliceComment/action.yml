name: 'ProposalPolice™ Comment Check Script'
description: 'Verifies whether a proposal comment follows the template OR an updated proposal had substantial changes'
inputs:
  GITHUB_TOKEN:
    description: 'Auth token for New Expensify Github'
    required: true
  PROPOSAL_POLICE_API_KEY:
    description: 'OpenAI API key for accessing AI services'
    required: true
  IS_TRUSTED_COMMENTER:
    description: 'Whether the commenter is a verified approved contributor or partner'
    required: true
  IS_TEAM_MEMBER:
    description: 'Whether the commenter is a member of one of the trusted Expensify GitHub teams'
    required: false
    default: 'false'
  COULD_NOT_VERIFY_TEAMS:
    description: 'Whether a team membership check failed, so the commenter might be a member'
    required: false
    default: 'false'
runs:
  using: 'node24'
  main: './index.js'
