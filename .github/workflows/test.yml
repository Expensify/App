name: Jest Unit Tests

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize]
    branches-ignore: [staging, production]
    paths: ['**.js', '**.ts', '**.tsx', 'package.json', 'package-lock.json']

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.ref, github.sha) || github.ref }}-jest
  cancel-in-progress: true

jobs:
  jest:
    if: ${{ github.event.head_commit.author.name != 'OSBotify' && github.event.head_commit.author.name != 'imgbot[bot]' || github.event_name == 'workflow_call' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      CI: true
      NODE_OPTIONS: '--experimental-vm-modules --max-old-space-size=8192'
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
    name: test (job ${{ fromJSON(matrix.chunk) }})
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@1c9394c220d293645707b625ba9d79685f093a8f # v1

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Mount Jest sticky disk
        # Persistent NVMe-backed disk on the runner (3s mount vs ~66s actions/cache download).
        # Key is stable (no lockfile/babel hash) - a hashed key would spin up a brand-new disk
        # on every lockfile bump, each billed for 7 idle days, and throw away the warm cache.
        # Jest versions its own transform-cache subdir by config hash inside this same mount, so
        # a config bump just adds a new subdir here instead of a new disk; run `jest --clearCache`
        # on a schedule to prune stale subdirs so the disk doesn't grow unbounded.
        # Branch Protection (Blacksmith dashboard, not a YAML input) must be enabled for this repo:
        # only push/schedule/workflow_dispatch on main can commit writes back to the disk; PR jobs
        # read the latest snapshot but their writes are discarded without failing the job.
        uses: useblacksmith/stickydisk@v1
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ matrix.chunk }}

      - name: Jest tests
        run: npm test -- --silent --shard=${{ fromJSON(matrix.chunk) }}/${{ strategy.job-total }} --maxWorkers=6 --coverage --coverageDirectory=coverage/shard-${{ matrix.chunk }}

      - name: Upload coverage to Codecov (PRs - tokenless)
        if: ${{ github.event_name == 'pull_request' }}
        # v7
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: coverage/shard-${{ matrix.chunk }}/coverage-final.json,coverage/shard-${{ matrix.chunk }}/lcov.info
          flags: unit
          name: jest-${{ matrix.chunk }}
          disable_search: true
          # TODO: Re-enable (https://github.com/Expensify/App/issues/82201)
          fail_ci_if_error: false

      - name: Load Codecov token from 1Password
        id: load-codecov-token
        # Codecov needs a token to be run on the default branch (which happens in preDeploy.yml after a PR is merged to main)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        # v4.0.0
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CODECOV_TOKEN: op://${{ vars.OP_VAULT }}//CodeCov-API/key

      - name: Upload coverage to Codecov (token required)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        # v7
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ steps.load-codecov-token.outputs.CODECOV_TOKEN }}
          files: coverage/shard-${{ matrix.chunk }}/coverage-final.json,coverage/shard-${{ matrix.chunk }}/lcov.info
          flags: unit
          name: jest-${{ matrix.chunk }}
          disable_search: true
          # TODO: Re-enable (https://github.com/Expensify/App/issues/82201)
          fail_ci_if_error: false

  storybookTests:
    if: ${{ github.event.head_commit.author.name != 'OSBotify' && github.event.head_commit.author.name != 'imgbot[bot]' || github.event_name == 'workflow_call' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Storybook tests
    steps:
      - uses: useblacksmith/checkout@1c9394c220d293645707b625ba9d79685f093a8f # v1

      - uses: ./.github/actions/composite/setupNode

      - name: Storybook run
        run: npm run storybook -- --smoke-test --ci
