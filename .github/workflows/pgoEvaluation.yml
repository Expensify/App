name: Verify native PGO on emulators

on:
  push:
    branches: ['@chrispader/perf/pgo-ci-verification']
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to verify
        type: choice
        default: both
        options: [both, android, ios]

permissions:
  contents: read

concurrency:
  group: pgo-emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  STANDALONE_NEW_DOT: 'false'
  IS_HYBRID_APP: 'true'
  BUNDLER: metro
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  verify:
    # Only the copied, reviewed branch in App receives private dependency access.
    if: github.repository == 'Expensify/App' && github.ref == 'refs/heads/@chrispader/perf/pgo-ci-verification'
    runs-on: ${{ matrix.platform == 'android' && 'ubuntu-24.04' || 'blacksmith-12vcpu-macos-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'android' && '["android"]' || inputs.platform == 'ios' && '["ios"]' || '["android","ios"]') }}
    steps:
      - name: Check existing repository secrets
        env:
          CHECKOUT_TOKEN: ${{ secrets.OS_BOTIFY_TOKEN }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_SDK_DOWNLOAD_TOKEN }}
        run: |
          test -n "$CHECKOUT_TOKEN" || { echo '::error::Add the existing OS_BOTIFY_TOKEN repository secret with access to Mobile-Expensify.'; exit 1; }
          test -n "$MAPBOX_TOKEN" || { echo '::error::Add the existing MAPBOX_SDK_DOWNLOAD_TOKEN repository secret.'; exit 1; }
      - name: Checkout the candidate and its pinned native sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          token: ${{ secrets.OS_BOTIFY_TOKEN }}
          persist-credentials: false
      - name: Verify native checkout
        run: |
          test "$(git -C Mobile-Expensify rev-parse HEAD)" = "$(git ls-tree HEAD Mobile-Expensify | awk '{print $3}')"
          test "$(./scripts/is-hybrid-app.sh)" = true
      - name: Free space for Android source builds
        if: matrix.platform == 'android'
        run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/powershell
      - name: Setup HybridApp dependencies
        uses: ./.github/actions/composite/setupNode
        with:
          IS_HYBRID_BUILD: 'true'
      - name: Setup private SDK downloads
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_SDK_DOWNLOAD_TOKEN }}
        run: ./scripts/setup-mapbox-sdk.sh "$MAPBOX_TOKEN"

      - name: Read repository Java version
        if: matrix.platform == 'android'
        id: java
        uses: ./.github/actions/composite/getJavaVersion
      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
      - name: Setup Android build tools and emulator access
        if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android PGO on a disposable emulator
        if: matrix.platform == 'android'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: npm run pgo:verify-ci -- android

      - name: Select repository Xcode
        if: matrix.platform == 'ios'
        uses: ./.github/actions/composite/getXcodeVersion
      - name: Setup Ruby and CocoaPods
        if: matrix.platform == 'ios'
        id: ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Verify iOS PGO on a disposable simulator
        if: matrix.platform == 'ios'
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: |
          export PATH="${{ steps.ruby.outputs.ruby-prefix }}/bin:$PATH"
          npm run pgo:verify-ci -- ios

      - name: Upload verification profiles and report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pgo-emulator-${{ matrix.platform }}
          path: .pgo/ci/${{ matrix.platform }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
