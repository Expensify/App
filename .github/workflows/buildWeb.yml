name: Build Web

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout and build
        type: string
        required: true
      environment:
        description: "'production', 'staging', or 'adhoc'"
        type: string
        required: true
      pull-request-number:
        description: Pull request number (used for adhoc builds)
        type: string
        default: ''
      build-preview-worker:
        description: Bundle the branch Worker for a per-PR deployment (after the existing reviewed-code gate)
        type: boolean
        default: false

    outputs:
      BUILD_SHA:
        description: Immutable App commit used for the web build and Worker bundle
        value: ${{ jobs.build.outputs.BUILD_SHA }}
      TAR_FILENAME:
        description: Filename of the .tar.gz web build artifact
        value: ${{ jobs.build.outputs.TAR_FILENAME }}
      ZIP_FILENAME:
        description: Filename of the .zip web build artifact
        value: ${{ jobs.build.outputs.ZIP_FILENAME }}
      SOURCEMAP_FILENAME:
        description: Filename of the web sourcemap artifact
        value: ${{ jobs.build.outputs.SOURCEMAP_FILENAME }}

jobs:
  build:
    name: Build Web
    runs-on: blacksmith-8vcpu-ubuntu-2404
    outputs:
      BUILD_SHA: ${{ steps.checkout.outputs.commit }}
      TAR_FILENAME: webBuild.tar.gz
      ZIP_FILENAME: webBuild.zip
      SOURCEMAP_FILENAME: merged-source-map.js.map
    env:
      PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
    steps:
      - name: Checkout
        id: checkout
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0
        with:
          ref: ${{ inputs.ref }}

      - name: Create .env.adhoc file based on staging
        if: ${{ inputs.environment == 'adhoc' }}
        run: |
          cp .env.staging .env.adhoc
          sed -i 's/ENVIRONMENT=staging/ENVIRONMENT=adhoc/' .env.adhoc

      - name: Inject CI data into JS bundle
        if: ${{ inputs.environment == 'adhoc' && inputs.pull-request-number != '' }}
        run: ./.github/scripts/inject-ci-data.sh PULL_REQUEST_NUMBER="$PULL_REQUEST_NUMBER"

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode
        with:
          WORKSPACES: ${{ inputs.build-preview-worker && '["web/cloudflare-worker"]' || '[]' }}

      - name: Build web
        run: |
          if [ "${{ inputs.environment }}" == "production" ]; then
            npm run build
          elif [ "${{ inputs.environment }}" == "staging" ]; then
            npm run build-staging
          else
            npm run build-adhoc
          fi
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # No Cloudflare credentials are available to branch dependencies, build hooks or the bundler.
      - name: Bundle the branch Worker for this web build
        if: ${{ inputs.build-preview-worker }}
        working-directory: web/cloudflare-worker
        run: |
          if ! node -e 'const fs = require("node:fs"); const expected = JSON.parse(fs.readFileSync("package.json", "utf8")).devDependencies.wrangler; process.exit(require("wrangler/package.json").version === expected ? 0 : 1)' 2>/dev/null; then
            npm ci --workspaces=false
          fi
          npx wrangler deploy --dry-run --env staging --outdir ../../pr-testing-worker
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {experimental_readRawConfig} from 'wrangler';
          const {rawConfig} = experimental_readRawConfig({config: 'wrangler.jsonc'});
          const runtime = {...rawConfig, ...rawConfig.env?.staging};
          writeFileSync('../../pr-testing-worker/runtime.json', JSON.stringify({
            compatibility_date: runtime.compatibility_date,
            compatibility_flags: runtime.compatibility_flags ?? [],
          }));
          NODE
        env:
          WRANGLER_SEND_METRICS: false

      - name: Upload the branch Worker bundle
        if: ${{ inputs.build-preview-worker }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-testing-worker-artifact
          path: ./pr-testing-worker
          if-no-files-found: error

      - name: Upload web sourcemaps artifact
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web-sourcemaps-artifact
          path: ./dist/merged-source-map.js.map

      - name: Compress web build .tar.gz and .zip
        run: |
          tar -czvf webBuild.tar.gz dist
          zip -r webBuild.zip dist

      - name: Upload .tar.gz web build artifact
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web-build-tar-gz-artifact
          path: ./webBuild.tar.gz

      - name: Upload .zip web build artifact
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web-build-zip-artifact
          path: ./webBuild.zip
