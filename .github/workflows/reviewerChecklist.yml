name: PR Reviewer Checklist

on: pull_request_review

jobs:
  # Note: PHP specifically looks for the name of this job, "checklist", so if the name of the job is changed,
  # then you also need to go into PHP and update the name of this job in the GH_JOB_NAME_CHECKLIST constant
  checklist:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.actor != 'OSBotify' && github.actor != 'imgbot[bot]'
    steps:
      # pull_request_review is a pull-request event, so a token makes paths-filter use the pulls API instead of git.
      - name: Filter paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          token: ${{ github.token }}
          predicate-quantifier: 'every'
          filters: |
            should_run:
              - '**'
              - '!docs/**/*.md'
              - '!docs/**/*.csv'

      # If the previous run of this check on the PR already passed, pass now. Checkout sometimes takes a minute or
      # longer for reasons outside this workflow, and the checklist result does not depend on a fresh checkout.
      # Step names below are part of that decision: a path-filter skip is not a pass, but a previous short-circuit is.
      - name: Check previous run
        id: previous
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const headRef = context.payload.pull_request.head.ref;
            const {owner, repo} = context.repo;
            const checklistStepName = 'reviewerChecklist.js';
            const previousRunStepName = 'Check previous run';

            core.setOutput('passed', 'false');

            function belongsToPullRequest(run, shas) {
                if (run.pull_requests?.some((pullRequest) => pullRequest.number === prNumber)) {
                    return true;
                }
                // Fork pull_request_review runs often leave pull_requests empty, so match the head SHA instead.
                return Boolean(run.head_sha) && shas.has(run.head_sha);
            }

            function passedChecklist(job) {
                if (!job || job.conclusion !== 'success') {
                    return false;
                }
                const steps = job.steps ?? [];
                const checklistStep = steps.find((step) => step.name === checklistStepName);
                if (checklistStep?.conclusion === 'success') {
                    return true;
                }
                // This run itself skipped the checklist because an earlier one passed. A path-filter skip does not
                // run this step, so it is not treated as a pass.
                const previousRunStep = steps.find((step) => step.name === previousRunStepName);
                return previousRunStep?.conclusion === 'success';
            }

            try {
                const commits = await github.paginate(github.rest.pulls.listCommits, {
                    owner,
                    repo,
                    pull_number: prNumber,
                    per_page: 100,
                });
                const shas = new Set(commits.map((commit) => commit.sha));

                const iterator = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
                    owner,
                    repo,
                    workflow_id: 'reviewerChecklist.yml',
                    branch: headRef,
                    event: 'pull_request_review',
                    per_page: 100,
                });

                let previousRun;
                let pages = 0;
                for await (const page of iterator) {
                    pages += 1;
                    const runs = Array.isArray(page.data) ? page.data : (page.data.workflow_runs ?? []);
                    previousRun = runs.find((run) => run.id !== context.runId && belongsToPullRequest(run, shas));
                    if (previousRun || pages >= 3) {
                        break;
                    }
                }

                if (!previousRun) {
                    core.info(`No previous reviewer checklist run found for PR #${prNumber}. The check will run.`);
                    return;
                }

                core.info(`Previous run ${previousRun.html_url} is ${previousRun.status}/${previousRun.conclusion ?? 'pending'}.`);
                if (previousRun.status !== 'completed' || previousRun.conclusion !== 'success') {
                    core.info('Previous run did not pass. The check will run.');
                    return;
                }

                const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
                    owner,
                    repo,
                    run_id: previousRun.id,
                    per_page: 100,
                });
                const checklistJob = jobs.jobs.find((job) => job.name === 'checklist');
                if (!passedChecklist(checklistJob)) {
                    core.info('Previous run succeeded without a passing reviewer checklist. The check will run.');
                    return;
                }

                core.info('Previous reviewer checklist run passed. Skipping checkout and re-run.');
                core.setOutput('passed', 'true');
            } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                core.warning(`Could not check the previous reviewer checklist run, so the check will run. ${message}`);
                core.setOutput('passed', 'false');
            }

      - name: Checkout
        if: steps.filter.outputs.should_run == 'true' && steps.previous.outputs.passed != 'true'
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0

      - name: reviewerChecklist.js
        if: steps.filter.outputs.should_run == 'true' && steps.previous.outputs.passed != 'true'
        uses: ./.github/actions/javascript/reviewerChecklist
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OS_BOTIFY_TOKEN: ${{ secrets.OS_BOTIFY_TOKEN }}
