name: Inspect sticky disks

on:
  pull_request:
    paths:
      - .github/workflows/inspectStickyDisks.yml
  workflow_dispatch:
    inputs:
      fullListing:
        description: 'Also print the full recursive file listing (can be hundreds of thousands of lines)'
        required: false
        type: boolean
        default: false

jobs:
  inspect:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        key:
          - Expensify/App-Linux-X64-node-modules-a02144f7ccc9b1274257116344071e59e5a8594bfa763aafac5f9d5285f5fd76
          - Expensify/App-Linux-X64-node-modules-e37f253be1f406112c7863dfca6a295338fef363670d185d7fd589b5e2cab87e
          - Expensify/App-Linux-X64-node-modules-c8f32670f4567788b58d3e46648b55d72ca06778b08154699117a2a50de430b8
          - Expensify/App-Linux-X64-node-modules-88a135cf25b3d34b38e2fb4eda9373b998f6afa73ce6c419c2b00408daced725
          - Expensify/App-Linux-X64-node-modules-867407e2ea058ac0ce4a4ab12bb85aca89911580f93894021b25c29739a8d53a
    name: ${{ matrix.key }}
    steps:
      - name: Mount sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ matrix.key }}
          path: /inspected-disk

      - name: Show disk summary
        run: |
          echo "::group::Disk usage total"
          sudo du -sh /inspected-disk || true
          echo "::endgroup::"

          echo "::group::Root listing (ls -la)"
          sudo ls -la /inspected-disk
          echo "::endgroup::"

          echo "::group::Size by top-level entry (sorted)"
          sudo du -h -d 2 /inspected-disk 2>/dev/null | sort -hr | head -100
          echo "::endgroup::"

          echo "::group::File/dir counts"
          echo "Files: $(sudo find /inspected-disk -type f | wc -l)"
          echo "Dirs:  $(sudo find /inspected-disk -type d | wc -l)"
          echo "::endgroup::"

          echo "::group::Newest 20 files (mtime)"
          sudo find /inspected-disk -type f -printf '%T@ %TY-%Tm-%Td %TH:%TM %p\n' 2>/dev/null | sort -nr | head -20 | cut -d' ' -f2-
          echo "::endgroup::"

      - name: Full recursive listing
        if: inputs.fullListing == true
        run: |
          echo "::group::Full listing"
          sudo find /inspected-disk -mindepth 1 -printf '%y %10s %p\n'
          echo "::endgroup::"
