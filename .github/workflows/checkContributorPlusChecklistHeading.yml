name: Check Contributor+ checklist heading

on:
  pull_request:
    types: [opened, synchronize]
    branches-ignore: [staging, production]
    paths:
      - 'contributingGuides/CONTRIBUTOR_PLUS_CHECKLIST.md'
      - 'scripts/checkContributorPlusChecklistHeading.sh'
      - '.github/workflows/checkContributorPlusChecklistHeading.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.ref, github.sha) || github.ref }}-contributor-plus-checklist-heading
  cancel-in-progress: true

jobs:
  check:
    name: Check Contributor+ checklist heading
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@1c9394c220d293645707b625ba9d79685f093a8f # v1

      - name: Check Contributor+ checklist heading
        run: ./scripts/checkContributorPlusChecklistHeading.sh
