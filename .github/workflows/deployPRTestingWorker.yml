name: Deploy PR-testing Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pr-testing-worker
  cancel-in-progress: false

jobs:
  validateActor:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      IS_DEPLOYER: ${{ steps.isUserDeployer.outputs.IS_DEPLOYER }}
    steps:
      - id: isUserDeployer
        run: |
          if gh api "/orgs/Expensify/teams/web-deployers/memberships/$GITHUB_ACTOR" --silent; then
            echo "IS_DEPLOYER=true" >> "$GITHUB_OUTPUT"
          elif gh api "/orgs/Expensify/teams/keyholders/memberships/$GITHUB_ACTOR" --silent; then
            echo "IS_DEPLOYER=true" >> "$GITHUB_OUTPUT"
          elif gh api "/orgs/Expensify/teams/mobile-deployers/memberships/$GITHUB_ACTOR" --silent; then
            echo "IS_DEPLOYER=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_DEPLOYER=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.OS_BOTIFY_COMMIT_TOKEN }}

  deploy:
    needs: validateActor
    if: ${{ needs.validateActor.outputs.IS_DEPLOYER == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web/cloudflare-worker
    env:
      WRANGLER_SEND_METRICS: false
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0

      - name: Setup Node
        # v6.1.0
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Deploy the existing PR-testing Worker
        run: npx wrangler deploy --config wrangler.pr-testing.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
