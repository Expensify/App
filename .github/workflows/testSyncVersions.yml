name: Test syncVersions script

# The syncVersions workflow runs on macOS, and its full version sync path depends on PlistBuddy and
# BSD `sed -i ''`. Those tests skip themselves on the Ubuntu runner the Bun tests job uses, so this
# runs the same suite on macOS whenever the script or its tests change.
on:
  pull_request:
    types: [opened, synchronize]
    branches-ignore: [staging, production]
    paths: ['.github/scripts/syncVersions.sh', 'tests/tooling/SyncVersions.test.ts', '.github/workflows/testSyncVersions.yml']

concurrency:
  group: ${{ github.ref }}-testSyncVersions
  cancel-in-progress: true

jobs:
  testSyncVersions:
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - name: Check out
        # Upstream checkout on macOS - Blacksmith's git-mirror cache can't work there (see workflows/README.md)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      # The single-file form documented in tests/tooling/README.md. Both --preload flags come from the
      # `test:bun` script, which can't be reused here because it hardcodes the whole tests/tooling root.
      - name: Bun tests
        run: TZ=utc bun test --parallel --preload ./scripts/stubReactNative.js --preload ./tests/tooling/setup.ts ./tests/tooling/SyncVersions.test.ts
