name: Seed Jest perf cache

# Writes the two entries the Reassure perf jobs read: the Jest transform cache, and `main`'s
# measured baseline (`.reassure/baseline.perf`). One `reassure --baseline` run produces both.
#
# Both have to be written from main: a cache entry is scoped to the ref that wrote it, so entries
# written by the pull_request-only perf workflow would be per-PR, and writing from main is what
# keeps them out of reach of fork PRs.
#
# No paths filter and no schedule - a run that finds an entry present skips the work behind it, so
# probing every push is what rebuilds an evicted transform entry.
#
# Its own workflow rather than a job in seedCache.yml, because the measure takes minutes where the
# rest of that workflow takes seconds. Under a per-ref group a merge burst would drop this baseline
# *and* that run's node_modules seeding: measured over 82 pushes to main, near one push in five.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keyed on the commit, like the entry this writes, so no run can supersede another one. All this
# dedupes is a manual dispatch fired at a sha a push is already measuring.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  seedJestPerfCache:
    name: Seed the Jest transform cache and main's baseline
    # Must match the perf measure jobs' runner class, so the transform output is interchangeable and
    # the baseline durations are comparable with the branch side's.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0

      # Writes normalized-package-lock.json, which the transform cache key hashes.
      - name: Setup NodeJS
        uses: ./.github/actions/composite/setupNode

      # Keyed on the commit alone, because `github.event.pull_request.base.sha` is what the perf
      # workflow will look this up by. That is the base tip recorded when the PR ref was last
      # updated, so it can lag main by one push - a miss there is a cold baseline, never a wrong one.
      #
      # lookup-only, because nothing here reads the file; it only decides whether this commit still
      # needs measuring, which is false only on a re-run.
      - name: Look up this commit's baseline
        id: lookupBaseline
        # v5.0.1
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: .reassure/baseline.perf
          key: ${{ format('{0}-{1}-reassure-baseline-{2}', runner.os, runner.arch, github.sha) }}
          lookup-only: true

      # Hashes normalized-package-lock.json (the app-version-stripped lockfile setupNode writes, so
      # deploy version bumps do not rotate the key) plus everything else that invalidates every entry
      # at once: patches/** for the toolchain, babel config for the Babel options, jest.config.js for
      # the config babel-jest hashes, .nvmrc for process.version.
      #
      # Not covered: `.env`, DEBUG_BABEL_TRACE and CAPTURE_METRICS, which babel.config.js reads at
      # require time to add plugins babel-jest does not hash into an entry's name. No job here writes
      # a `.env`, so all of them inline the same EXPO_PUBLIC_* defaults; a step that gave one job its
      # own would make restored output wrong rather than stale, and would have to be hashed in here.
      #
      # No restore-keys, here or in the perf workflow: a prefix fallback would carry over output
      # built by the previous toolchain, which is what the lockfile hash exists to prevent.
      #
      # A restore rather than a lookup, because this job measures on every push and wants that
      # measure warm; the save below still only writes when this missed.
      - name: Restore the Jest transform cache
        id: restoreJestCache
        # v5.0.1
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: .jest-cache
          key: ${{ format('{0}-{1}-jest-perf-{2}', runner.os, runner.arch, hashFiles('normalized-package-lock.json', 'patches/**', 'babel.config.js', 'config/babel/**', 'jest.config.js', '.nvmrc')) }}

      # Must be the invocation the perf jobs run: Jest hashes the serialized project config into
      # every entry's key, so a different testMatch populates a key space the perf jobs never read.
      # (--baseline vs --branch never reaches Jest - see reassure-cli commands/measure.js.)
      #
      # Deliberately allowed to fail the job. Both saves below skip on a failure because a plain
      # `if:` implies success(), so no partial entry is written. Do not add continue-on-error without
      # emitting a ::warning:: too - that would turn this job green with no symptom at all.
      - name: Measure the baseline
        id: measureBaseline
        if: steps.lookupBaseline.outputs.cache-hit != 'true'
        shell: bash
        run: NODE_OPTIONS=--experimental-vm-modules npx reassure --baseline

      - name: Save this commit's baseline
        if: steps.lookupBaseline.outputs.cache-hit != 'true'
        # v5.0.1
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: .reassure/baseline.perf
          key: ${{ format('{0}-{1}-reassure-baseline-{2}', runner.os, runner.arch, github.sha) }}

      # For people: the cache entry above is what the perf workflow consumes, this is how a baseline
      # is read after the fact - to diff two commits, or to recover an evicted entry.
      - name: Upload this commit's baseline
        if: steps.lookupBaseline.outputs.cache-hit != 'true'
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reassure-baseline-${{ github.sha }}
          path: .reassure/baseline.perf
          include-hidden-files: true
          # A re-run whose entry was evicted since attempt 1 re-uploads a name attempt 1 claimed.
          overwrite: true
          retention-days: 14

      # Guarded on both lookups, so an entry is only ever built from a directory this run's own Jest
      # populated: a commit whose baseline is already cached skips the measure, leaving no
      # transform set to save.
      - name: Save the Jest transform cache
        if: steps.restoreJestCache.outputs.cache-hit != 'true' && steps.lookupBaseline.outputs.cache-hit != 'true'
        # v5.0.1
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: .jest-cache
          key: ${{ format('{0}-{1}-jest-perf-{2}', runner.os, runner.arch, hashFiles('normalized-package-lock.json', 'patches/**', 'babel.config.js', 'config/babel/**', 'jest.config.js', '.nvmrc')) }}

      - name: Report what was seeded
        if: always()
        run: |
          # A measure that died partway leaves a readable file that nothing cached, since both saves
          # imply success() - hence the outcome check before the file check.
          if [[ "${{ steps.measureBaseline.outcome }}" == "failure" ]]; then
            echo "::notice::Baseline for ${{ github.sha }}: measure failed, nothing cached"
          elif [[ -f .reassure/baseline.perf ]]; then
            # Counting measurement records, not lines: the file's first line is a metadata object.
            echo "::notice::Baseline for ${{ github.sha }}: $(grep -c '"meanDuration"' .reassure/baseline.perf) measurements"
          else
            echo "::notice::Baseline for ${{ github.sha }}: not measured this run (cache-hit=${{ steps.lookupBaseline.outputs.cache-hit || 'false' }})"
          fi
          if [[ -d .jest-cache ]]; then
            echo "::notice::Jest perf cache: $(du -sm .jest-cache | cut -f1)MB, $(find .jest-cache -type f | wc -l) files (cache-hit=${{ steps.restoreJestCache.outputs.cache-hit || 'false' }})"
          else
            echo "::notice::Jest perf cache: not populated this run (cache-hit=${{ steps.restoreJestCache.outputs.cache-hit || 'false' }})"
          fi
