name: Add [No QA] to help site PR titles

# Help site PRs (every changed file is under docs/) don't need QA, so their titles get a [No QA] prefix. The staging
# deploy checklist (.github/libs/DeployChecklistUtils.ts) and Web-Expensify (Github_Utils::isNoQAPullRequest) read
# that prefix to skip QA.
#
# This workflow only ever ADDS the prefix, and only to docs-only PRs. It never removes [No QA] from a title, and it
# leaves PRs with any change outside docs/ untouched, so authors of code PRs can keep using [No QA] as they do today.
#
# This used to be a step inside deployExpensifyHelp.yml, so it was skipped whenever that build was cancelled, failed,
# or came from a fork. It now runs on its own:
#   - pull_request_target so it can edit titles on PRs from forks too. It never checks out or runs PR code; it only
#     reads the PR's file list and title through the API.
#   - It re-runs whenever the PR is edited or pushed to, so a removed or overwritten prefix comes back.
#   - Fallback: it runs once more when the PR is merged, before the staging deploy builds the QA checklist.
#     Title edits made with GITHUB_TOKEN don't trigger new workflow runs, so this can't loop.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, closed]
    branches: [main]
    paths:
      - 'docs/**'

concurrency:
  group: helpdot-no-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  addNoQAPrefix:
    name: Ensure [No QA] on docs-only PRs
    # On close, only act if the PR was merged
    if: ${{ github.event.action != 'closed' || github.event.pull_request.merged }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Add [No QA] if every changed file is under docs/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # --paginate so PRs with more than 30 files are fully checked
          nonDocsFiles=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename | select(startswith("docs/") | not)')
          if [[ -n "$nonDocsFiles" ]]; then
            echo "This PR changes files outside docs/, so its title is left as the author wrote it:"
            echo "$nonDocsFiles"
            exit 0
          fi

          # Read the current title from the API rather than the event payload, which can be stale
          title=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.title')

          # Same match as DeployChecklistUtils.ts: [No QA] or [NoQA], any case, anywhere in the title
          if grep -qiE '\[No ?QA\]' <<< "$title"; then
            echo "Title is already marked [No QA]: $title"
            exit 0
          fi

          gh api --method PATCH "repos/$REPO/pulls/$PR_NUMBER" -f title="[No QA] $title" --jq '.title'
