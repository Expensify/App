name: Bun tests

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize]
    branches-ignore: [staging, production]
    paths:
      - 'server/**'
      - 'src/**'
      - 'tests/tooling/**'
      - 'tests/utils/**'
      - '.github/actions/javascript/**'
      - '.github/libs/**'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'bunfig.toml'
      - '.bun-version'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bunTests.yml'
      # tests/tooling asserts the Jest transform cache key stays in sync across these three workflows.
      - '.github/workflows/reassurePerformanceTests.yml'
      - '.github/workflows/seedJestPerfCache.yml'
      - '.github/workflows/seedCache.yml'

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.ref, github.sha) || github.ref }}-bun-tests
  cancel-in-progress: true

jobs:
  test:
    name: Bun tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Run Bun tests
        run: npm run test:bun

      - name: Build victory-chart-renderer Linux x64 binary
        run: npm run server:vcr:build:linux

      - name: Smoke-test compiled victory-chart-renderer binary
        run: ./server/victory-chart-renderer/dist/victory-chart-renderer-linux-x64 --chart-xml "$(cat server/victory-chart-renderer/tests/fixtures/top-categories-6.xml)" --out /tmp/vcr-smoke.png && test -s /tmp/vcr-smoke.png
