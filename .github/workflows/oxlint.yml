name: Oxlint check (non-blocking)

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize]
    branches-ignore: [production]
    paths: ['**.js', '**.ts', '**.tsx', '**.json', '**.mjs', '**.cjs', 'oxlint.config.mts', 'config/oxlint/**', 'scripts/lint/**', '.github/workflows/oxlint.yml']

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.ref, github.sha) || github.ref }}-oxlint
  cancel-in-progress: true

jobs:
  oxlint:
    name: Oxlint check (non-blocking)
    if: ${{ (github.event.head_commit.author.name != 'OSBotify' || github.event_name == 'push') && (github.event_name != 'pull_request' || github.actor != 'os-botify[bot]') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0
        with:
          token: ${{ github.event_name == 'push' && secrets.OS_BOTIFY_COMMIT_TOKEN || github.token }}

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Lint JavaScript and TypeScript with Oxlint
        id: oxlint
        continue-on-error: true
        # oxlint runs JS plugins on one thread (oxc#26621), so OxlintLinter splits them into 4 shards on this 8 vCPU runner.
        # While oxlint is a non-blocking check, the post-merge run both adds and removes entries from the oxlint.seatbelt.tsv.
        # Remove this once oxlint becomes the blocking linter.
        env:
          SEATBELT_INCREASE: ${{ github.event_name == 'push' && github.event.head_commit.author.name != 'OSBotify' && 'all' || '' }}
        run: npm run lint -- --linter=oxlint --shards=4

      - name: Check for an updated oxlint-seatbelt baseline
        id: seatbelt_diff
        if: github.event_name == 'push'
        run: |
          if git diff --quiet config/oxlint/oxlint.seatbelt.tsv; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the Oxlint result without failing the job
        run: |
          if [[ "${{ steps.oxlint.outcome }}" != "success" ]]; then
            echo "::warning::Oxlint found errors this PR adds (see the step log). This check is temporarily non-blocking while oxlint runs next to ESLint."
          elif [[ "${{ steps.seatbelt_diff.outputs.updated }}" == "true" ]]; then
            echo "::notice::This merge changed the list of known oxlint errors (config/oxlint/oxlint.seatbelt.tsv). OSBotify commits the update. Temporary while oxlint runs next to ESLint."
          else
            echo "::notice::Oxlint found no new errors."
          fi

      - name: Setup git for OSBotify
        if: steps.seatbelt_diff.outputs.updated == 'true'
        uses: Expensify/GitHub-Actions/setupGitForOSBotify@main
        with:
          OP_VAULT: ${{ vars.OP_VAULT }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SETUP_AS_APP: false

      - name: Auto-commit updated oxlint-seatbelt baseline
        if: steps.seatbelt_diff.outputs.updated == 'true'
        continue-on-error: true
        run: |
          git add config/oxlint/oxlint.seatbelt.tsv
          git commit -m "Auto-update oxlint-seatbelt baseline"
          git push origin main
