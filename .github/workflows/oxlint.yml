name: Oxlint check (non-blocking)

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize]
    branches-ignore: [staging, production]
    paths: ['**.js', '**.ts', '**.tsx', '**.json', '**.mjs', '**.cjs', 'oxlint.config.mts', 'config/oxlint/**', 'scripts/lint/**', '.github/workflows/oxlint.yml']

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.ref, github.sha) || github.ref }}-oxlint
  cancel-in-progress: true

jobs:
  oxlint:
    name: Oxlint check (non-blocking)
    if: ${{ github.event.head_commit.author.name != 'OSBotify' || github.event_name == 'push' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0
        with:
          token: ${{ github.event_name == 'push' && secrets.OS_BOTIFY_COMMIT_TOKEN || github.token }}

      - name: Setup Node
        uses: ./.github/actions/composite/setupNode

      - name: Lint JavaScript and TypeScript with Oxlint
        id: oxlint
        continue-on-error: true
        # oxlint runs JS plugins on one thread (oxc#26621), so OxlintLinter fans them across 4
        # single-threaded shards and runs the type-aware rules in one multi-threaded process: 8 vCPU.
        env:
          OXLINT_SHARDS: 4
        run: npm run lint -- --linter=oxlint

      - name: Report the Oxlint result without failing the job
        run: |
          if [[ "${{ steps.oxlint.outcome }}" == "success" ]]; then
            echo "::notice::Oxlint found no errors above its baseline."
          else
            echo "::warning::Oxlint reported errors above its baseline. Non-blocking during the migration; see the step log."
          fi

      - name: Check for tightened oxlint-seatbelt baseline
        id: seatbelt_diff
        if: github.event_name == 'push'
        run: |
          if git diff --quiet config/oxlint/oxlint.seatbelt.tsv; then
            echo "tightened=false" >> "$GITHUB_OUTPUT"
            echo "::notice::oxlint.seatbelt.tsv unchanged; skipping auto-commit."
          else
            echo "tightened=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup git for OSBotify
        if: steps.seatbelt_diff.outputs.tightened == 'true'
        uses: Expensify/GitHub-Actions/setupGitForOSBotify@main
        with:
          OP_VAULT: ${{ vars.OP_VAULT }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SETUP_AS_APP: false

      - name: Auto-commit tightened oxlint-seatbelt baseline
        if: steps.seatbelt_diff.outputs.tightened == 'true'
        continue-on-error: true
        run: |
          git add config/oxlint/oxlint.seatbelt.tsv
          git commit -m "Auto-tighten oxlint-seatbelt baseline"
          git push origin main
