name: Reassure Performance Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches-ignore: [staging, production]
    paths:
      [
        'src/**',
        'modules/*/src/**',
        'tests/perf-test/**',
        'tests/utils/**',
        'jest/**',
        '__mocks__/**',
        'assets/emojis/**',
        'patches/**',
        'config/babel/**',
        'babel.config.js',
        'jest.config.js',
        'modules/*/package.json',
        'package.json',
        'package-lock.json',
        '.nvmrc',
        '.github/workflows/reassurePerformanceTests.yml',
        '.github/workflows/seedJestPerfCache.yml',
        '.github/actions/javascript/validateReassureOutput/**',
        '.github/actions/composite/setupNode/**',
      ]

# Cancel a run still measuring an earlier push to the same PR. pull_request-only, so github.ref is
# refs/pull/<n>/merge and the group is one PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-perf-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0

      # The merge ref's base parent: the commit branch-perf-tests measures against. Read out of the
      # commit object because the checkout is --depth=1, so `git rev-parse HEAD^1` has no object to
      # resolve. base.sha is the fallback only; GitHub can recompute it away from that parent.
      - name: Resolve the baseline commit
        id: baselineCommit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          # awk stops at the blank line ending the header, so a message line starting with "parent"
          # cannot be read as one.
          SHA=$(git cat-file -p HEAD | awk '/^$/{exit} /^parent /{print $2; exit}')
          if [[ -z "$SHA" ]]; then
            echo "::warning::Could not read the merge ref's base parent; keying the baseline on pull_request.base.sha instead."
            SHA="$BASE_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Before setupNode: the key hashes no lockfile, and not running setupNode is most of the saving.
      # Restore-only for the same reasons as the Jest transform cache below.
      - name: Restore the baseline measured on main
        id: restoreBaseline
        # v5.0.1
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: .reassure/baseline.perf
          key: ${{ format('{0}-{1}-reassure-baseline-{2}', runner.os, runner.arch, steps.baselineCommit.outputs.sha) }}

      # A miss is otherwise silent, and reads the same whether nothing was written or the key drifted.
      - name: Report where the baseline came from
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.baselineCommit.outputs.sha }}
          CACHE_HIT: ${{ steps.restoreBaseline.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == "true" ]]; then
            echo "::notice::Restored main's baseline for $BASELINE_SHA from the cache; not measuring it here."
          else
            echo "::warning::No cached baseline for $BASELINE_SHA - measuring it in this job. Expected when the seed run on that commit has not finished or failed; otherwise seedJestPerfCache.yml has stopped writing the entry."
          fi

      - name: Check out the baseline commit
        if: steps.restoreBaseline.outputs.cache-hit != 'true'
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.baselineCommit.outputs.sha }}
        run: |
          set -e
          # That commit, not the tip of main: the tip moves mid-run, and measuring the two sides at
          # different trees is the noise this comparison exists to detect. Only its source tree is
          # needed, and a reachable SHA can be fetched bare.
          git fetch origin "$BASELINE_SHA" --no-tags --depth=1
          git checkout --force --detach FETCH_HEAD --no-recurse-submodules

      - name: Setup NodeJS
        if: steps.restoreBaseline.outputs.cache-hit != 'true'
        uses: ./.github/actions/composite/setupNode

      # Skips a cold Babel pass over the whole source tree; seedJestPerfCache.yml writes the entry
      # on main and explains the key. Restore-only, so nothing an untrusted PR runs can end up in an
      # entry a later run executes, and no restore-keys: a prefix fallback could serve output built
      # by an older babel-plugin-react-compiler and move the render counts gated at
      # COUNT_DEVIATION: 0. Keep the key identical to the other three.
      - name: Restore Jest transform cache
        id: restoreJestCache
        if: steps.restoreBaseline.outputs.cache-hit != 'true'
        # v5.0.1
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: .jest-cache
          key: ${{ format('{0}-{1}-jest-perf-{2}', runner.os, runner.arch, hashFiles('normalized-package-lock.json', 'patches/**', 'babel.config.js', 'config/babel/**', 'jest.config.js', '.nvmrc')) }}

      # A miss only makes this job slow, so this warning is the only symptom of a cache that
      # silently died: `Report Jest cache size` below reads the directory after the perf run, by
      # which point Jest has written a full transform set either way.
      - name: Warn on a Jest transform cache miss
        if: steps.restoreBaseline.outputs.cache-hit != 'true' && steps.restoreJestCache.outputs.cache-hit != 'true'
        run: echo "::warning::Jest perf transform cache miss - this job re-transforms the whole source tree. Expected only when the toolchain key rotated (lockfile, patches, Babel or Jest config, Node version); otherwise seedJestPerfCache.yml has stopped writing the entry."

      - name: Run baseline performance tests
        if: steps.restoreBaseline.outputs.cache-hit != 'true'
        shell: bash
        run: NODE_OPTIONS=--experimental-vm-modules npx reassure --baseline

      # Compare against the seed job's notice on a recent push to main: near zero means the seed
      # stopped running, roughly double means a second transform set is being written.
      - name: Report Jest cache size
        if: ${{ !cancelled() && steps.restoreBaseline.outputs.cache-hit != 'true' }}
        run: |
          if [[ -d .jest-cache ]]; then
            echo "::notice::Jest perf cache: $(du -sm .jest-cache | cut -f1)MB, $(find .jest-cache -type f | wc -l) files"
          else
            echo "::notice::Jest perf cache: absent"
          fi

      - name: Upload baseline performance results
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reassure-baseline-results
          path: ./.reassure/baseline.perf
          include-hidden-files: true

  branch-perf-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0

      - name: Setup NodeJS
        uses: ./.github/actions/composite/setupNode

      # Skips a cold Babel pass over the whole source tree; seedJestPerfCache.yml writes the entry
      # on main and explains the key. Restore-only, so nothing an untrusted PR runs can end up in an
      # entry a later run executes, and no restore-keys: a prefix fallback could serve output built
      # by an older babel-plugin-react-compiler and move the render counts gated at
      # COUNT_DEVIATION: 0. Keep the key identical to the other three.
      - name: Restore Jest transform cache
        id: restoreJestCache
        # v5.0.1
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: .jest-cache
          key: ${{ format('{0}-{1}-jest-perf-{2}', runner.os, runner.arch, hashFiles('normalized-package-lock.json', 'patches/**', 'babel.config.js', 'config/babel/**', 'jest.config.js', '.nvmrc')) }}

      # A miss only makes this job slow, so this warning is the only symptom of a cache that
      # silently died: `Report Jest cache size` below reads the directory after the perf run, by
      # which point Jest has written a full transform set either way.
      - name: Warn on a Jest transform cache miss
        if: steps.restoreJestCache.outputs.cache-hit != 'true'
        run: echo "::warning::Jest perf transform cache miss - this job re-transforms the whole source tree. Expected only when the toolchain key rotated (lockfile, patches, Babel or Jest config, Node version); otherwise seedJestPerfCache.yml has stopped writing the entry."

      - name: Run branch performance tests
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
        run: NODE_OPTIONS=--experimental-vm-modules npx reassure --branch="$BRANCH" --commit-hash="$COMMIT_HASH" --no-compare

      # Compare against the seed job's notice on a recent push to main: near zero means the seed
      # stopped running, roughly double means a second transform set is being written.
      - name: Report Jest cache size
        if: ${{ !cancelled() }}
        run: |
          if [[ -d .jest-cache ]]; then
            echo "::notice::Jest perf cache: $(du -sm .jest-cache | cut -f1)MB, $(find .jest-cache -type f | wc -l) files"
          else
            echo "::notice::Jest perf cache: absent"
          fi

      - name: Upload branch performance results
        # v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reassure-branch-results
          path: ./.reassure/current.perf
          include-hidden-files: true

  validate-perf-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [baseline-perf-tests, branch-perf-tests]
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1.7.0

      - name: Setup NodeJS
        uses: ./.github/actions/composite/setupNode

      - name: Download baseline performance results
        # v7
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: reassure-baseline-results
          path: ./.reassure

      - name: Download branch performance results
        # v7
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: reassure-branch-results
          path: ./.reassure

      - name: Compare performance results
        run: node -e "require('@callstack/reassure-compare').compare().catch((error) => { console.error(error); process.exit(1); })"

      - name: Validate output.json
        id: validateReassureOutput
        uses: ./.github/actions/javascript/validateReassureOutput
        with:
          DURATION_DEVIATION_PERCENTAGE: 20
          COUNT_DEVIATION: 0
