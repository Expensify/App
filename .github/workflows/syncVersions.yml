name: Sync E/App and Mobile-Expensify versions

on:
  workflow_dispatch:
    inputs:
      TARGET_VERSION:
        description: 'Version to sync to (must match the Mobile-Expensify version, leave empty to auto-detect from Mobile-Expensify)'
        required: false
        type: string

jobs:
  syncVersions:
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - name: Check out
        # Upstream checkout on macOS - Blacksmith's git-mirror cache can't work there (see workflows/README.md)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          submodules: true
          # The OS_BOTIFY_COMMIT_TOKEN is a personal access token tied to osbotify
          # This is a workaround to allow pushes to a protected branch
          token: ${{ secrets.OS_BOTIFY_COMMIT_TOKEN }}

      - name: Validate actor is a mobile deployer
        uses: ./.github/actions/composite/validateActor
        with:
          REQUIRE_APP_DEPLOYER: true
          OS_BOTIFY_TOKEN: ${{ secrets.OS_BOTIFY_COMMIT_TOKEN }}

      - name: Setup git for OSBotify
        uses: Expensify/GitHub-Actions/setupGitForOSBotify@main
        id: setupGitForOSBotify
        with:
          OP_VAULT: ${{ vars.OP_VAULT }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SETUP_AS_APP: false

      # The checkout above is pinned to main, so dispatching from a branch reads this workflow file from
      # that branch but still gets main's copy of the script - leaving no way to try a script change
      # before it lands on main. Read into a temp file rather than over the working tree, which has to
      # stay clean for the rebase in the push retry path.
      - name: Resolve the script to run
        id: script
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == 'main' ]]; then
            echo "SCRIPT_PATH=./.github/scripts/syncVersions.sh" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Running syncVersions.sh from $REF_NAME rather than main"
          git fetch origin "$REF_NAME"
          git show "origin/$REF_NAME:.github/scripts/syncVersions.sh" > "$RUNNER_TEMP/syncVersions.sh"
          chmod +x "$RUNNER_TEMP/syncVersions.sh"
          echo "SCRIPT_PATH=$RUNNER_TEMP/syncVersions.sh" >> "$GITHUB_OUTPUT"

      - name: Check sync state (versions + submodule pointer)
        id: checkSync
        env:
          SCRIPT: ${{ steps.script.outputs.SCRIPT_PATH }}
        run: |
          "$SCRIPT" check

      - name: Setup Node
        if: steps.checkSync.outputs.NEED_FULL_VERSION_SYNC == 'true'
        uses: ./.github/actions/composite/setupNode

      - name: Sync versions and verify
        id: performSync
        if: steps.checkSync.outputs.IN_SYNC != 'true'
        env:
          SCRIPT: ${{ steps.script.outputs.SCRIPT_PATH }}
          TARGET_VERSION: ${{ inputs.TARGET_VERSION }}
          NEED_FULL_VERSION_SYNC: ${{ steps.checkSync.outputs.NEED_FULL_VERSION_SYNC }}
          EXPECTED_SUBMODULE_SHA: ${{ steps.checkSync.outputs.ACTUAL_SHA }}
        run: |
          "$SCRIPT" sync

      - name: Announce sync in Slack
        if: steps.checkSync.outputs.IN_SYNC != 'true'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#deployer",
              "attachments": [{
                "color": "good",
                "text": "✅ Version sync completed. E/App and Mobile-Expensify are at ${{ steps.performSync.outputs.POST_SYNC_APP_VERSION }}; submodule matches Mobile-Expensify main."
              }]
            }

      - name: Announce failed workflow in Slack
        if: ${{ failure() }}
        uses: ./.github/actions/composite/announceFailedWorkflowInSlack
        with:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
