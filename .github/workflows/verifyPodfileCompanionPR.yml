name: Verify Podfile.lock companion PR

on:
  pull_request:
    types: [opened, synchronize, edited]
    branches-ignore: [staging, production]
    paths:
      - 'ios/Podfile.lock'
      - '.github/scripts/verifyPodfileCompanionPR.sh'
      - '.github/workflows/verifyPodfileCompanionPR.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: 'Verify Podfile.lock companion PR'
    # Bot PRs never carry a companion Mobile-Expensify PR. Keyed on the PR author rather than
    # github.actor, which on an `edited` event is whoever edited the description.
    if: github.event.pull_request.user.login != 'OSBotify' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # v1
      - name: Checkout
        uses: useblacksmith/checkout@1c9394c220d293645707b625ba9d79685f093a8f

      # `git diff A...B` needs both commits and their merge base, not the whole history.
      - name: Fetch both ends of the PR
        run: git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # The job still fails below; this only defers it so the comment step can run first.
      - name: Verify a companion Mobile-Expensify PR is linked
        id: verify
        continue-on-error: true
        run: ./.github/scripts/verifyPodfileCompanionPR.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}

      # A red check alone does not say what to do, and the instructions in the pull request template
      # sit inside an HTML comment that never renders. On a fork the token is read-only and posting
      # is not possible, so a failure here must not replace the check's own failure.
      - name: Tell the author what to do
        if: steps.verify.outcome == 'failure'
        continue-on-error: true
        # v8
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            // Identifies our own comment on a later run, so pushes update it instead of stacking.
            const MARKER = '<!-- verify-podfile-companion-pr -->';
            const body = [
              MARKER,
              `Hi @${context.payload.pull_request.user.login}, this PR changes the dependencies in \`ios/Podfile.lock\`, but does not link a Mobile-Expensify PR.`,
              '',
              'HybridApp keeps its own lockfile at `Mobile-Expensify/iOS/Podfile.lock` and it does not update itself, so without a matching change there the HybridApp build resolves a different native dependency graph than the one you tested here.',
              '',
              '1. Run `npm run pod-install` from the repository root to regenerate the HybridApp lockfile.',
              '2. Open a Mobile-Expensify PR with that change and add its link here, while it is still open:',
              '   `MOBILE-EXPENSIFY: https://github.com/Expensify/Mobile-Expensify/pull/<PR-number>`',
              '3. Land the two together, the Mobile-Expensify PR first.',
              '',
              'If your change genuinely cannot affect HybridApp, say why in the description instead: `NO-HYBRIDAPP-IMPACT: <reason>`',
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const existing = comments.find((comment) => comment.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Fail if no companion PR is linked
        if: steps.verify.outcome == 'failure'
        run: exit 1
